<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puntos y Canjes - Comunidad</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: monospace, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }
        h2 {
            border-bottom: 2px solid #001240;
            padding-bottom: 8px;
            color: #001240;
            font-size: 1.2rem;
        }
        .box {
            background: #ffffff;
            border: 1px solid #001240;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        label {
            color: #001240;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #ffffff;
            border: 1px solid #001240;
            color: #000000;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 0.9rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #001240;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.9rem;
            color: #000000;
        }
        th {
            color: #001240;
        }
        button {
            background: #001240;
            color: #ffffff;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background: #002270;
        }
        #mensaje-copiado {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #001240;
            text-align: center;
        }
        /* Estilo del panel owner unificado en azul y blanco */
        .admin-panel {
            display: none;
            border-color: #001240;
            background: #fff;
        }
        .admin-panel h2 {
            color: #001240;
            border-color: #001240;
        }
        .admin-panel input {
            border-color: #001240;
        }
        .admin-panel button.btn-accion {
            background: #001240;
            color: #ffffff;
        }
        .admin-panel button.btn-eliminar {
            background: #ffffff;
            color: #001240;
            border: 1px solid #001240;
            font-weight: bold;
        }
        .admin-panel button.btn-eliminar:hover {
            background: #f0f4ff;
        }
    </style>
</head>
<body>

    <!-- ZONA 1: TABLA DE PUNTOS CON BUSCADOR -->
    <div class="box">
        <h2>LISTA PUNTOS</h2>
        <!-- Escribe #J aquí para abrir el panel de owner -->
        <input type="text" id="buscador" placeholder="Buscar usuario..." onkeyup="verificarOwnerYFiltrar()">
        
        <table id="tabla-usuarios">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Puntos</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla">
                <tr><td colspan="2">Cargando puntos...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- PANEL OWNER (Oculto hasta escribir #J en el buscador) -->
    <div class="box admin-panel" id="panelAdmin">
        <h2>PANEL OWNER</h2>
        <p style="font-size: 0.85rem; margin-top:5px; color: #001240;">Gestionando datos internos:</p>
        
        <p style="font-weight: bold; margin-top:15px; font-size:0.9rem; color: #001240;">Modificar Usuario Existente:</p>
        <input type="text" id="targetUser" placeholder="Usuario exacto (ej: @usuario_activo)">
        <input type="text" id="nuevoNombre" placeholder="Nuevo nombre (opcional)">
        <input type="number" id="nuevosPuntos" placeholder="Nuevos puntos (opcional)">
        <button class="btn-accion" onclick="ejecutar('editar')">Actualizar Datos</button>
        <button class="btn-eliminar" onclick="ejecutar('eliminar')">Eliminar Usuario</button>

        <hr style="border: 0; border-top: 1px solid #001240; margin: 20px 0;">

        <p style="font-weight: bold; font-size:0.9rem; color: #001240;">Agregar Nuevo Usuario:</p>
        <input type="text" id="addNombre" placeholder="Nombre de usuario">
        <input type="number" id="addPuntos" placeholder="Puntos iniciales">
        <button class="btn-accion" onclick="ejecutar('agregar')">Crear Usuario</button>
    </div>

    <!-- ZONA 2: ZONA DE CANJE -->
    <div class="box">
        <h2>ZONA DE CANJE</h2>
        <label for="usuario">Tu usuario:</label>
        <input type="text" id="usuario" placeholder="Escribe tu nombre aquí...">

        <label for="select" style="display:block; margin-top:10px;">Selecciona canje:</label>
        <select id="select">
            <option value="Promoción de arte (100 Pts)">Promoción de arte - 100 Pts</option>
            <option value="Quitar 1 advertencia (250 Pts)">Quitar 1 advertencia - 250 Pts</option>
            <option value="Quitar 2 advertencias (470 Pts)">Quitar 2 advertencia - 470 Pts</option>
        </select>

        <button onclick="generarYEnviarCanje()">Canjear y Enviar al Owner</button>
        <div id="mensaje-copiado"></div>
    </div>

    <script>
        let listaGlobalUsuarios = [];

        window.onload = function() {
            cargarPuntos();
        };

        function cargarPuntos() {
            fetch('/api/puntos')
                .then(res => res.json())
                .then(data => {
                    listaGlobalUsuarios = data;
                    mostrarTabla(data);
                })
                .catch(err => {
                    document.getElementById('cuerpo-tabla').innerHTML = '<tr><td colspan="2">Error al cargar datos</td></tr>';
                });
        }

        function mostrarTabla(datos) {
            let cuerpoTabla = document.getElementById('cuerpo-tabla');
            cuerpoTabla.innerHTML = '';
            if(datos.length === 0) {
                cuerpoTabla.innerHTML = '<tr><td colspan="2">No hay usuarios registrados</td></tr>';
                return;
            }
            datos.forEach(item => {
                cuerpoTabla.innerHTML += `<tr><td>${item.usuario}</td><td>${item.puntos}</td></tr>`;
            });
        }

        function verificarOwnerYFiltrar() {
            let textoBuscador = document.getElementById('buscador').value;

            if (textoBuscador === "#J") {
                document.getElementById('panelAdmin').style.display = "block";
                return;
            }

            let filtro = textoBuscador.toLowerCase();
            let filtrados = listaGlobalUsuarios.filter(u => u.usuario.toLowerCase().includes(filtro));
            mostrarTabla(filtrados);
        }

        function ejecutar(accion) {
            let targetUser = document.getElementById('targetUser').value.trim();
            let nuevoNombre = document.getElementById('nuevoNombre').value.trim();
            let nuevosPuntos = document.getElementById('nuevosPuntos').value;
            
            let addNombre = document.getElementById('addNombre').value.trim();
            let addPuntos = document.getElementById('addPuntos').value;

            let datos = { password: "#J", accion };

            if(accion === 'agregar') {
                datos.nuevoNombre = addNombre;
                datos.nuevosPuntos = addPuntos;
            } else {
                datos.usuarioMeta = targetUser;
                datos.nuevoNombre = nuevoNombre;
                datos.nuevosPuntos = nuevosPuntos;
            }

            fetch('/api/admin/actualizar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(res => res.json())
            .then(data => {
                if(data.error) {
                    alert("Error: " + data.error);
                } else {
                    alert("¡Acción aplicada con éxito!");
                    document.getElementById('buscador').value = "";
                    document.getElementById('targetUser').value = "";
                    document.getElementById('nuevoNombre').value = "";
                    document.getElementById('nuevosPuntos').value = "";
                    document.getElementById('addNombre').value = "";
                    document.getElementById('addPuntos').value = "";
                    cargarPuntos();
                }
            });
        }

        function generarYEnviarCanje() {
            let usuario = document.getElementById('usuario').value.trim();
            let premioSeleccionado = document.getElementById('select').value;
            let aviso = document.getElementById('mensaje-copiado');

            if (usuario === "") {
                alert("Por favor, escribe tu usuario antes de canjear.");
                return;
            }

            let textoMensaje = `Hola Owner, soy *${usuario}* y quiero canjear mis puntos por: *${premioSeleccionado}*.`;
            let numeroOwner = "TU_NUMERO_DE_TELEFONO"; // Recuerda poner tu número aquí
            let urlWhatsApp = `https://wa.me/${numeroOwner}?text=` + encodeURIComponent(textoMensaje);

            aviso.innerText = "¡Redirigiendo a WhatsApp con tu solicitud!";
            
            setTimeout(() => {
                window.location.href = urlWhatsApp;
            }, 500);
        }
    </script>

</body>
</html>
